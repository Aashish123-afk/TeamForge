<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Signup | TeamForge</title>
    <link rel="stylesheet" href="../style/student_signup.css">
    <script src="../js/student_signup.js" defer></script>
</head>
<body>
    <main class="signup-container">
        <div class="signup-card">
            <a href="../auth.html" class="logo">
                <span class="logo-mark">T</span>
                <span class="team-text">Team</span><span class="forge-text">Forge</span>
            </a>
            <h1>Create your account</h1>
            <p class="subtitle">Join TeamForge and find your perfect team.</p>
            <form id="signupForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                        minlength="2"
                    >
                </div>
                <div class="form-group">
                    <label for="email">College Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="studentId">Student ID / Roll Number</label>
                    <input
                        type="text"
                        id="studentId"
                        name="studentId"
                        placeholder="Enter your student ID"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="course">Course / Department</label>
                    <input
                        type="text"
                        id="course"
                        name="course"
                        placeholder="e.g. B.Tech CSE"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                    <small>Use at least 8 characters.</small>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        required
                    >
                </div>
                <label class="terms">
                    <input type="checkbox" id="agreeTerms" required>
                    <span>I agree to use TeamForge responsibly.</span>
                </label>
                <p id="signupMessage" class="signup-message"
                   role="status" aria-live="polite"></p>

                <button type="submit" class="signup-button">
                    Create Account
                </button>
            </form>
            <p class="login-text">
                Already have an account?
                <a href="stud_login.html">Log in</a>
            </p>
            <p class="security-note">
                TeamForge · Student Community
            </p>
        </div>
    </main>
</body>
</html>
