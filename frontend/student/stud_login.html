<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f8fc">
    <title>Student Login | TeamForge</title>
    <link rel="stylesheet" href="../style/app.css">
    <script src="../js/stud_login.js" defer></script>
</head>
<body data-role="student">
    <main class="auth-container">
        <section class="auth-card" aria-labelledby="loginTitle">
            <div class="back-navigation">
                <a href="../auth.html" class="back-link">
                    <span aria-hidden="true">&larr;</span>
                    <span>Back to role selection</span>
                </a>
            </div>
            <a href="../auth.html" class="logo" aria-label="TeamForge home">
                <span class="logo-mark">T</span>
                <span class="team-text">Team</span><span class="forge-text">Forge</span>
            </a>
            <header class="auth-heading">
                <p class="auth-eyebrow">STUDENT PORTAL</p>
                <h1 id="loginTitle">Welcome back!</h1>
                <p>
                    Sign in to find your team, connect with students,
                    and bring your project ideas to life.
                </p>
            </header>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your college email"
                        autocomplete="username"
                        spellcheck="false"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password"
                            aria-controls="password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember-option" for="rememberMe">
                        <input
                            type="checkbox"
                            id="rememberMe"
                            name="rememberMe"
                        >
                        <span>Remember me</span>
                    </label>
                    <a href="forgot_password.html" class="text-link">
                        Forgot password?
                    </a>
                </div>
                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    <span>Sign in</span>
                    <span aria-hidden="true">&rarr;</span>
                </button>
                <p
                    id="loginMessage"
                    class="login-message"
                    role="status"
                    aria-live="polite"
                ></p>

            </form>
            <div class="signup-text">
                <span>New to TeamForge?</span>
                <a href="student_signup.html" class="text-link">
                    Create an account
                </a>
            </div>
            <footer class="security-note">
                <span aria-hidden="true">&#128274;</span>
                <span>Your next great collaboration starts here.</span>
            </footer>
        </section>
    </main>
    <script>
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {
            const shouldShow = passwordInput.type === "password";
            passwordInput.type = shouldShow ? "text" : "password";
            togglePassword.textContent = shouldShow ? "Hide" : "Show";
            togglePassword.setAttribute(
                "aria-label",
                shouldShow ? "Hide password" : "Show password"
            );
            togglePassword.setAttribute(
                "aria-pressed",
                String(shouldShow)
            );
        });
    </script>
</body>
</html>
