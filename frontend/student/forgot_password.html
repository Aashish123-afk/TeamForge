<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | TeamForge</title>
    <link rel="stylesheet" href="../style/forgot_password.css">
    <script src="../js/forgot_password.js" defer></script>
</head>
<body>
    <main class="auth-container">
        <section class="auth-card" aria-labelledby="pageTitle">
            <a href="stud_login.html" class="back-link">&larr; Back to login</a>

            <a href="../auth.html" class="logo" aria-label="TeamForge home">
                <span class="logo-mark">T</span><span class="team-text">Team</span><span class="forge-text">Forge</span>
            </a>

            <div class="auth-heading">
                <h1 id="pageTitle">Forgot your password?</h1>
                <p>Enter the email address associated with your TeamForge account. We'll help you get back in.</p>
            </div>

            <form id="resetForm" novalidate>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your college email"
                           autocomplete="email" required
                           aria-describedby="emailHelp formMessage">
                    <small id="emailHelp">Use the email address registered with your account.</small>
                </div>

                <button type="submit" class="primary-button" id="resetButton">
                    Continue <span aria-hidden="true">&rarr;</span>
                </button>
                <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
            </form>

            <p class="security-note">TeamForge · Student account recovery</p>
        </section>
    </main>
</body>
</html>
