<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamForge | Login</title>
    <link rel="stylesheet" href="auth_ind.css">
</head>
<body>
    <div class="background-logos">
        <span>Team<span>Forge</span></span>
        <span>Team<span>Forge</span></span>
        <span>Team<span>Forge</span></span>
        <span>Team<span>Forge</span></span>
        <span>Team<span>Forge</span></span>
        <span>Team<span>Forge</span></span>
        <span>Team<span>Forge</span></span>
        <span>Team<span>Forge</span></span>
        <span>Team<span>Forge</span></span>
        <span>Team<span>Forge</span></span>
        <span>Team<span>Forge</span></span>
        <span>Team<span>Forge</span></span>
    </div>
    <main class="auth-container">
        <div class="auth-card">
            <div class="logo">

                <div class="logo-mark">
                    T
                </div>
                <span class="team-text">Team</span><span class="forge-text">Forge</span>
            </div>
            <div class="auth-heading">
                <h1>Welcome to TeamForge</h1>
                <p>
                    Choose your account type to continue.
                </p>
            </div>
            <div class="login-options">
                <button class="login-button student-button" id="studentLogin">
                    <div class="button-content">
                        <div class="button-icon">
                            S
                        </div>
                        <div>
                            <strong>Student Login</strong>
                            <span>Find teammates and teams</span>
                        </div>
                    </div>
                    <span class="arrow">→</span>
                </button>
                <button class="login-button admin-button" id="adminLogin">

                    <div class="button-content">

                        <div class="button-icon">
                            A
                        </div>
                        <div>
                            <strong>Admin Login</strong>
                            <span>Manage the platform</span>
                        </div>
                    </div>
                    <span class="arrow">→</span>
                </button>
            </div>
            <div class="auth-footer">
                <span>
                    TeamForge
                </span>
                <p>
                    Collaborative, easy-to-use project team building platform
                </p>
            </div>
        </div>
    </main>
    <script src="auth_ind.js"></script>
</body>
</html>
